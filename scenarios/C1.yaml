id: C1
title: Full morning (18 present), normal day
seed:
  date: "2026-11-07"
  present: 18
  fixtureSet: full-roster
  policyOverrides: {}
timeline:
  - at: "2026-11-07T06:00:00+07:00"
    do: meal_plan.generate
    with:
      shift: MORNING
  - at: "2026-11-07T10:00:00+07:00"
    do: meal_plan.execute
    with:
      shift: MORNING
expect:
