    equals: 7
    description: "Break plan generated for 7 Tier-1 posts"
  - assert: meal_plan.state_transitions_valid
    equals: true
    description: "Executes via state machine (HANDOVER_PENDING -> RELIEVED_FOR_MEAL -> OCCUPIED for each)"
  - assert: alerts.count
    equals: 0
    description: "Zero alerts"
  - assert: incidents.count
    equals: 0
    description: "Zero incidents"
