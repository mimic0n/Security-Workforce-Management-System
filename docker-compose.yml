version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: swms-postgres
    restart: always
    environment:
      POSTGRES_USER: swms
      POSTGRES_PASSWORD: swms_password
      POSTGRES_DB: swms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
